name: Build and publish Marp slides

on:
  push:
    branches: [main]
    paths:
      - 'machine-learning-slides.md'
      - 'deftech3.css'
      - 'images/**'
      - '.github/workflows/build-slides.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: marp-slides-main
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Render slides
        run: >
          npx --yes @marp-team/marp-cli@4.0.3
          --html --theme-set deftech3.css
          --output machine-learning.html
          -- machine-learning-slides.md
      - name: Commit and push HTML
        run: |
          git add -- machine-learning.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Regenerate Marp slides'
          git push origin HEAD:main
      - name: Stage presentation and images
        run: |
          mkdir -p _site
          cp machine-learning.html _site/
          cp -R images _site/images
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy presentation to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
